<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{site}}/work/{{slug}}.html">
<meta property="og:type" content="article">
<meta property="og:url" content="{{site}}/work/{{slug}}.html">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="Kajal &amp; Co.">
<meta property="og:locale" content="en_GB">
{{#thumb}}<meta property="og:image" content="{{site}}/{{thumb}}">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="{{thumbAlt}}">{{/thumb}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
{{#thumb}}<meta name="twitter:image" content="{{site}}/{{thumb}}">{{/thumb}}
<link rel="icon" href="{{base}}favicon.ico" sizes="32x32">
<link rel="icon" href="{{base}}assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{base}}assets/img/apple-touch-icon.png">
<link rel="manifest" href="{{base}}site.webmanifest">
<meta name="theme-color" content="#742aff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=Geist+Mono:wght@300..700&amp;display=swap">
<link rel="stylesheet" href="{{base}}assets/css/style.css">
{{!
  The visible breadcrumb in case-hero is mirrored here so the trail is
  machine-readable too. Positions match the rendered nav exactly.
}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Our Works", "item": "{{site}}/portfolio.html" },
    { "@type": "ListItem", "position": 2, "name": "{{serviceLabel}}", "item": "{{site}}/portfolio.html#{{service}}" },
    { "@type": "ListItem", "position": 3, "name": "{{client}}", "item": "{{site}}/work/{{slug}}.html" }
  ]
}
</script>
</head>
<body>
<div class="preloader" data-preloader aria-hidden="true">
  <div class="preloader__inner">
    <img class="preloader__logo" src="{{base}}assets/img/logo-bold-black.svg" alt="" width="137" height="32">
    <div class="preloader__track"><div class="preloader__bar"></div></div>
  </div>
</div>

<a class="skip-link" href="#main">Skip to content</a>
