      <article class="work-card" data-service="{{service}}" data-reveal>
        <a class="work-card__link" href="{{base}}work/{{slug}}.html">
          <span class="work-card__media">
            {{#thumb}}<img src="{{base}}{{thumb}}" alt="{{thumbAlt}}" width="1600" height="900" loading="lazy" decoding="async">{{/thumb}}
          </span>
          <span class="work-card__body">
            <span class="work-card__tags"><span>{{industry}}</span></span>
            <h3 class="h3">{{client}}</h3>
            <span class="body work-card__sub">{{{card.blurb}}}</span>
            <span class="link-arrow">View Case Study
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
          </span>
        </a>
      </article>
