# Static site served straight from the repo root.
#
# The generated case-study pages are committed, so the site would deploy
# correctly without this step. Running it anyway means a push that edits
# data/projects.json but forgets `node build.js` still ships the right pages —
# and a malformed content file fails the deploy instead of reaching the site.

[build]
  publish = "."
  command = "node build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Logos are stable, but filenames are not hashed — keep the window short
# enough that a replaced logo shows up the same day.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# case-studies/*.md is the working source for data/projects.json. It is in the
# repo on purpose, but publish = "." would serve it as a second, raw copy of
# every page under work/ — duplicate public content on a site that sells SEO.
[[redirects]]
  from = "/case-studies/*"
  to = "/"
  status = 404
  force = true
